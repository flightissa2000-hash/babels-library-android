<!doctype html>
<html lang="en" data-theme="wordtown">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babel's Library</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="nav-menu" id="navMenu" type="button" aria-label="Menu">☰</button>
  <span class="brand-mark" aria-hidden="true"></span>
  <button class="prof-chip" id="profChip" type="button" hidden></button>
  <h1>Babel's Library</h1>
  <time class="clock" id="clock"></time>
  <button class="sync-pill" id="syncPill" type="button"><i></i><span>…</span></button>
</header>
<main id="view"></main>
<!-- one set of tabs; Settings → Look → Getting around: index cards down the right edge, or a side drawer (html[data-nav]) -->
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on" style="--k:0"><b>⌂</b><span>Home</span></button>
  <button data-tab="library" style="--k:1"><b>▥</b><span>Library</span></button>
  <button data-tab="catalogue" style="--k:2"><b>✦</b><span>Catalogue</span></button>
  <button data-tab="news" style="--k:3"><b>❡</b><span>News</span></button>
  <button data-tab="journal" style="--k:4"><b>✎</b><span>Journal</span></button>
  <button data-tab="browser" style="--k:5"><b>◍</b><span>Browser</span></button>
  <button data-tab="settings" style="--k:6"><b>⚙</b><span>Settings</span></button>
  <button class="nav-hide" id="navHide" type="button" title="Hide the tabs (full screen)"><b>⇥</b><span>Hide tabs</span></button>
</nav>
<button class="nav-nub" id="navNub" type="button" aria-label="Show the tabs"><i>‹</i><b id="navNubIc">⌂</b></button>
<div class="nav-scrim" id="navScrim"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="reader" class="reader" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="js/themes.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dictate.js"></script>
<script src="js/journal.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/news.js"></script>
<script src="js/readers.js"></script>
</body>
</html>
