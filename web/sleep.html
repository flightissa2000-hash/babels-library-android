<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep screen</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
/* Babel's sleep screen: the time, the date, what you're reading and this week's challenge, drawn in your theme.
   Shown by the app when you leave it idle (in a frame over it) and by Android as the screen saver (SleepDream).
   Everything drifts a little now and then so nothing burns into the screen. */
:root{--bg:#0d1b3d;--ink:#fff4d6;--soft:#b9c6e6;--accent:#ffc93c;--surface:#1a2b57}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:none}
#scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#card{position:fixed;left:50%;top:46%;width:min(88vw,520px);transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)));transition:transform 4s ease-in-out;text-align:center;z-index:2}
.clock{font-size:clamp(4.2rem,24vw,9.5rem);line-height:.95;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:.26em;font-weight:700;margin-left:.15em;letter-spacing:.04em;opacity:.8}
.date{margin-top:.5rem;font-size:clamp(1rem,4.6vw,1.35rem);font-weight:700;color:var(--soft)}
.now{display:flex;gap:16px;align-items:center;text-align:left;margin:2.2rem auto 0;padding:14px 16px;max-width:430px;border-radius:18px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.now[hidden]{display:none}
.cov{flex:none;width:64px;height:96px;border-radius:6px;background:var(--accent) center/cover;box-shadow:0 6px 18px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden;font-size:.6rem;font-weight:800;padding:4px;text-align:center;color:#fff}
.now .t{min-width:0;flex:1}
.now .lbl{display:block;font-size:.68rem;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.now b{display:block;font-size:1.08rem;line-height:1.25;margin:3px 0 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now .by{display:block;font-size:.85rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:5px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit}
.note{display:block;font-size:.78rem;color:var(--soft);margin-top:5px}
.chal{margin-top:1rem;font-size:.92rem;font-weight:700;color:var(--soft)}
.chal[hidden]{display:none}
#bat{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:.9rem;font-weight:700;color:var(--soft);z-index:2;font-variant-numeric:tabular-nums}
#wake{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));text-align:center;font-size:.8rem;color:var(--soft);opacity:.0;transition:opacity 1.2s;z-index:2}
#wake.on{opacity:.75}

/* ---- Word Town at night: a moon, drifting clouds, the town's windows going dark one by one */
html[data-t=wordtown]{--bg:#0d1b3d;--ink:#fff4d6;--soft:#b9c6e6;--accent:#ffc93c;--surface:#1b2d5e}
html[data-t=wordtown] body{background:linear-gradient(180deg,#081230 0%,#13285a 55%,#2a3f7e 100%)}
html[data-t=wordtown] .clock{font-family:"Fredoka","Nunito",sans-serif;font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.18),0 0 30px rgba(255,201,60,.18)}
html[data-t=wordtown] .now{border:3px solid rgba(255,255,255,.12);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.moon{position:absolute;right:12%;top:9%;width:74px;height:74px;border-radius:50%;background:#fff1c4;box-shadow:0 0 50px 10px rgba(255,236,170,.25)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(214,196,140,.55)}
.moon::before{width:16px;height:16px;left:18px;top:20px}.moon::after{width:10px;height:10px;left:44px;top:42px}
.cloud{position:absolute;height:26px;border-radius:26px;background:rgba(190,205,240,.13);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:34px;height:34px;left:16%;top:-17px}.cloud::after{width:24px;height:24px;left:52%;top:-11px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
html[data-t=wordtown] #bat,html[data-t=wordtown] #wake{text-shadow:0 1px 3px #050b1f,0 0 10px #050b1f}
.town{position:absolute;left:0;right:0;bottom:0;height:24vh;display:flex;align-items:flex-end;gap:2px;padding:0 2px}
.house{position:relative;flex:1;background:#0a1430;border-radius:6px 6px 0 0}
.house::before{content:"";position:absolute;left:50%;top:-14px;width:0;height:0;transform:translateX(-50%);border:solid transparent;border-width:0 calc(var(--w,40px)/2) 15px;border-bottom-color:#0a1430}
.win{position:absolute;width:9px;height:11px;border-radius:2px;background:#ffc93c;box-shadow:0 0 8px rgba(255,201,60,.7);transition:opacity 3s}
.win.off{opacity:.06;box-shadow:none}
.zz{position:absolute;font:700 1.2rem "Fredoka",sans-serif;color:#cfd9ff;opacity:0;animation:zz 7s ease-in infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.8}100%{opacity:0;transform:translate(40px,-110px) scale(1.3)}}

/* ---- Gruvbox: a terminal that's gone to sleep */
html[data-t=gruvbox]{--bg:#1d2021;--ink:#ebdbb2;--soft:#a89984;--accent:#fabd2f;--surface:#282828}
html[data-t=gruvbox] body,html[data-t=gruvbox] #bat,html[data-t=gruvbox] #wake{font-family:"IBM Plex Mono",ui-monospace,monospace}
html[data-t=gruvbox] #card{text-align:left;background:#282828;border:1px solid #3c3836;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:0 0 18px;overflow:hidden}
html[data-t=gruvbox] #card::before{content:"● ● ●   babel@phone: ~";display:block;padding:9px 14px;background:#3c3836;color:#928374;font-size:.78rem;letter-spacing:.06em;word-spacing:-.2em;margin-bottom:12px;
  background-image:none}
html[data-t=gruvbox] .term{padding:0 18px}
html[data-t=gruvbox] .p{display:block;color:#b8bb26;font-size:.85rem;margin-top:10px}
html[data-t=gruvbox] .p::before{content:"$ ";color:#fe8019}
html[data-t=gruvbox] .clock{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:clamp(3.2rem,17vw,6.4rem);color:#fabd2f;letter-spacing:-.04em}
html[data-t=gruvbox] .date{color:#83a598;margin-top:2px;font-size:.95rem}
html[data-t=gruvbox] .now{margin:6px 0 0;padding:0;background:none;border-radius:0;max-width:none}
html[data-t=gruvbox] .cov{width:48px;height:72px;border-radius:2px;filter:sepia(.35) saturate(.9)}
html[data-t=gruvbox] .now .lbl{color:#d3869b;letter-spacing:.04em}
html[data-t=gruvbox] .bar{display:none}
html[data-t=gruvbox] .ascii{display:block;color:#b8bb26;font-size:.85rem;margin-top:6px;white-space:pre}
html[data-t=gruvbox] .chal{color:#8ec07c;font-size:.85rem;margin-top:4px}
html[data-t=gruvbox] .cur{display:inline-block;width:.6em;height:1.05em;background:#fe8019;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
html:not([data-t=gruvbox]) .p,html:not([data-t=gruvbox]) .ascii,html:not([data-t=gruvbox]) .last{display:none}
html[data-t=gruvbox] .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}

/* ---- Galaxy: the Milky Way turning slowly, stars twinkling */
html[data-t=galaxy]{--bg:#04061a;--ink:#e6ebff;--soft:#a9b3e0;--accent:#9b8cff;--surface:#0e1436}
html[data-t=galaxy] .sky{position:absolute;inset:-10% -60%;background:url("sky/milkyway.jpg") center/cover;opacity:.55;animation:pan 240s linear infinite alternate}
@keyframes pan{from{transform:translateX(-12%) rotate(-4deg)}to{transform:translateX(12%) rotate(4deg)}}
html[data-t=galaxy] .veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(4,6,26,.1),rgba(4,6,26,.75) 75%)}
html[data-t=galaxy] .clock{font-weight:300;letter-spacing:.02em;text-shadow:0 0 24px rgba(155,140,255,.55),0 0 2px #fff}
html[data-t=galaxy] .now{background:rgba(10,14,40,.45);border:1px solid rgba(150,170,255,.2);backdrop-filter:blur(8px)}
html[data-t=galaxy] .now .lbl{color:#ffd98a}
html[data-t=galaxy] .bar i{background:linear-gradient(90deg,#9b8cff,#8fb8ff)}

/* ---- E-reader: black on white, nothing moves */
html[data-t=eink]{--bg:#fff;--ink:#000;--soft:#444;--accent:#000;--surface:#fff}
html[data-t=eink] body{font-family:"Libre Baskerville",Georgia,serif}
html[data-t=eink] .clock{font-weight:400;letter-spacing:-.03em}
html[data-t=eink] #card{transition:none}
html[data-t=eink] .now{border:2px solid #000;border-radius:4px}
html[data-t=eink] .cov{filter:grayscale(1);box-shadow:none;border:1px solid #000}
html[data-t=eink] .bar{border:1px solid #000;background:#fff;height:8px}
html[data-t=eink] #wake{transition:none}
/* sideways (charging on a stand, say): the clock on the left, what you're reading on the right */
@media (orientation:landscape) and (max-height:600px){
  .clock{font-size:clamp(3.4rem,28vh,8rem)}
  #card{width:min(92vw,880px);top:50%}
  .term{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:34px;align-items:center;text-align:left}
  .term>*{grid-column:1}
  .term>.now,.term>.chal,.term>#nowP{grid-column:2}
  .term>.now{grid-row:1 / span 3;margin:0}
  .term>.chal{grid-row:4;margin-top:6px}
  .term>.p{display:none!important}
  html[data-t=gruvbox] #card{padding-bottom:12px}
  .town{height:20vh}
  .moon{width:56px;height:56px}
}
</style>
</head>
<body>
<div id="scene"></div>
<main id="card">
  <div class="term">
    <span class="p">date +%R</span>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <span class="p" id="nowP" hidden>cat now-reading</span>
    <div class="now" id="now" hidden>
      <div class="cov" id="cov"></div>
      <div class="t"><span class="lbl" id="lbl"></span><b id="title"></b><span class="by" id="by"></span><div class="bar"><i id="pct"></i></div><span class="ascii" id="ascii"></span><span class="note" id="note"></span></div>
    </div>
    <div class="chal" id="chal" hidden></div>
    <span class="p last">sleep ∞ <span class="cur"></span></span>
  </div>
</main>
<div id="wake">Tap to wake</div>
<div id="bat"></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const inApp = qs.has("inapp");
  let D = {}, theme = "";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function scene(t) {
    const sc = $("#scene");
    let h = "";
    const rnd = (a, b) => a + Math.random() * (b - a);
    if (t === "wordtown") {
      for (let i = 0; i < 40; i++) h += `<i class="star" style="left:${rnd(0, 100)}%;top:${rnd(0, 55)}%;animation-delay:${rnd(0, 4)}s;opacity:.5"></i>`;
      h += `<div class="moon"></div>`;
      for (let i = 0; i < 4; i++) h += `<div class="cloud" style="top:${rnd(8, 45)}%;width:${rnd(90, 160)}px;animation-duration:${rnd(80, 150)}s;animation-delay:-${rnd(0, 150)}s"></div>`;
      let town = "";
      const n = 9;
      for (let i = 0; i < n; i++) {
        const ht = rnd(42, 100), w = 100 / n;
        let wins = "";
        for (let r = 0; r < Math.floor(ht / 28); r++) for (let c = 0; c < 2; c++) if (Math.random() < .7) wins += `<i class="win${Math.random() < .3 ? " off" : ""}" style="left:${22 + c * 38}%;bottom:${14 + r * 24}%"></i>`;
        town += `<div class="house" style="height:${ht}%;--w:${Math.round(innerWidth * w / 100)}px">${wins}</div>`;
      }
      h += `<div class="town">${town}</div>`;
      for (let i = 0; i < 3; i++) h += `<span class="zz" style="left:${30 + i * 18}%;bottom:${22 + i * 2}vh;animation-delay:${i * 2.3}s">z</span>`;
    } else if (t === "galaxy") {
      h = `<div class="sky"></div><div class="veil"></div><canvas id="stars"></canvas>`;
    } else if (t === "gruvbox") {
      h = `<div class="scan"></div>`;
    }
    sc.innerHTML = h;
    if (t === "galaxy") twinkle();
  }
  // (Galaxy) a canvas of small stars, each breathing at its own pace
  function twinkle() {
    const c = $("#stars"), x = c.getContext("2d");
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    c.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
    const st = Array.from({ length: 110 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: (Math.random() * 1.3 + .3) * devicePixelRatio, p: Math.random() * 6.28, s: .4 + Math.random() * 1.2 }));
    let last = 0;
    const draw = (t) => {
      requestAnimationFrame(draw);
      if (t - last < 66) return;          // (15 frames a second is plenty for a night sky)
      last = t;
      x.clearRect(0, 0, c.width, c.height);
      for (const s of st) { x.globalAlpha = .35 + .65 * Math.abs(Math.sin(s.p + t / 1000 * s.s)); x.fillStyle = "#fff"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.29); x.fill(); }
    };
    requestAnimationFrame(draw);
  }
  // (Word Town) the town goes to bed: a window goes dark now and then, and once in a while one comes back on
  setInterval(() => {
    if (theme !== "wordtown") return;
    const on = [...document.querySelectorAll(".win:not(.off)")], off = [...document.querySelectorAll(".win.off")];
    if (on.length > 2 && Math.random() < .8) on[Math.floor(Math.random() * on.length)].classList.add("off");
    else if (off.length) off[Math.floor(Math.random() * off.length)].classList.remove("off");
  }, 9000);

  function tick() {
    const d = new Date();
    const parts = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit" }).formatToParts(d);
    const hm = parts.filter((p) => p.type !== "dayPeriod").map((p) => p.value).join("").trim();
    const ap = (parts.find((p) => p.type === "dayPeriod") || {}).value || "";
    $("#clock").innerHTML = `${esc(hm)}${ap ? `<small>${esc(ap)}</small>` : ""}`;
    $("#date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  }

  function paint() {
    const t = (D.theme && D.theme.key) || "wordtown";
    if (t !== theme) { theme = t; document.documentElement.dataset.t = t; scene(t); }
    // a theme the page doesn't know: its own colours from the app
    if (!["wordtown", "gruvbox", "galaxy", "eink"].includes(t) && D.theme) {
      const r = document.documentElement.style;
      for (const [k, v] of [["--bg", D.theme.bg], ["--ink", D.theme.ink], ["--soft", D.theme.soft], ["--accent", D.theme.accent], ["--surface", D.theme.surface]]) if (v) r.setProperty(k, v);
    }
    const it = D.item;
    $("#now").hidden = $("#nowP").hidden = !it;
    if (it) {
      $("#lbl").textContent = it.label || "CONTINUE READING";
      $("#title").textContent = it.title || "";
      $("#by").textContent = it.by || "";
      $("#note").textContent = it.note || "";
      const p = Math.max(0, Math.min(100, Number(it.pct) || 0));
      $("#pct").style.width = p + "%";
      const n = Math.round(p / 10);
      $("#ascii").textContent = "[" + "█".repeat(n) + "░".repeat(10 - n) + "] " + p + "%";
      const cov = $("#cov");
      cov.style.backgroundColor = it.color || "";
      cov.textContent = it.has_cover ? "" : (it.title || "").slice(0, 40);
      if (it.has_cover) {
        const img = new Image();
        img.onload = () => { cov.style.backgroundImage = `url("${img.src}")`; cov.textContent = ""; };
        img.onerror = () => { cov.textContent = (it.title || "").slice(0, 40); };
        img.src = `/wcover/${encodeURIComponent(it.cover_id || it.id)}`;
      }
    }
    const ch = D.challenge;
    $("#chal").hidden = !ch;
    if (ch) $("#chal").textContent = (theme === "gruvbox" ? "# " : "★ ") + ch.text;
  }

  async function data() {
    try { D = await (await fetch("/sleepdata.json", { cache: "no-store" })).json(); } catch (e) { D = {}; }
    paint();
  }
  async function battery() {
    try {
      const b = await (await fetch("/battery.json", { cache: "no-store" })).json();
      $("#bat").textContent = b.level >= 0 ? `${b.charging ? "⚡ Charging · " : ""}${b.level}%` : "";
    } catch (e) {}
  }
  // drift: a little somewhere else every minute (on e-ink, rarely and without motion)
  function drift() {
    const k = Math.min(innerWidth, innerHeight);
    const r = document.documentElement.style;
    r.setProperty("--dx", Math.round((Math.random() - .5) * k * .12) + "px");
    r.setProperty("--dy", Math.round((Math.random() - .5) * k * .16) + "px");
  }

  tick(); data(); battery();
  setInterval(tick, 1000 * 5);
  setInterval(battery, 60000);
  setInterval(data, 5 * 60000);
  setInterval(() => { if (theme !== "eink" || Math.random() < .1) drift(); }, 60000);
  // "Tap to wake" for a moment at first
  const w = $("#wake"); w.classList.add("on"); setTimeout(() => w.classList.remove("on"), 4000);
  if (inApp) {
    const wake = () => parent.postMessage({ babel: "wake" }, "*");
    addEventListener("pointerdown", wake);
    addEventListener("keydown", wake);
  }
})();
</script>
</body>
</html>
